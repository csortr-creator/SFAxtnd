name: Build and Release APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: "1.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b

      - name: Setup Java 17 (for libbox build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: ${{ runner.os }}-libbox-${{ hashFiles('libbox/**', '**/go.sum', '**/go.mod') }}

      - name: Build libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          cd libbox
          go run ./cmd/internal/build_libbox
          mkdir -p ../app/libs
          find . -name "*.aar" -exec cp -f {} ../app/libs/libbox.aar \;

      - name: Setup Java 21 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup fixed debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/other/debug -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed -E "s/SFA-[0-9\.]+-/SFAxtnd-${APP_VERSION}-/g" | sed "s/-debug//g" | sed "s/app-other/SFAxtnd-${APP_VERSION}/g")
            cp "$file" "release_apks/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
