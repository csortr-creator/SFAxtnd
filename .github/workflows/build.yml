name: Build and Release APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: "1.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Java 17 (for libbox build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Resolve libbox submodule path
        id: libbox-path
        run: |
          echo "=== submodule status ==="
          git submodule status
          MODDIR=$(find . -maxdepth 3 -name "go.mod" -not -path "./go.mod" -exec dirname {} \; | head -n1)
          if [ -z "$MODDIR" ]; then
            echo "No submodule go.mod found — check .gitmodules"
            exit 1
          fi
          MODDIR=${MODDIR#./}
          echo "dir=$MODDIR" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-parse HEAD:"$MODDIR")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using module dir: $MODDIR (commit $SHA)"

      - name: Cache libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: ${{ runner.os }}-libbox-${{ steps.libbox-path.outputs.sha }}

      - name: Build libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          cd "${{ steps.libbox-path.outputs.dir }}"
          go run ./cmd/internal/build-libbox || go run ./cmd/internal/build-libbox -target android || go run ./cmd/internal/build_libbox || go run ./cmd/internal/build_libbox -target android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          find . -name "libbox.aar" -exec cp -f {} "$GITHUB_WORKSPACE/app/libs/" \;

      - name: Setup Java 21 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup fixed debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/other/debug -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed -E "s/SFA-[0-9\.]+-/SFAxtnd-${APP_VERSION}-/g" | sed "s/-debug//g" | sed "s/app-other/SFAxtnd-${APP_VERSION}/g")
            cp "$file" "release_apks/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
