name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Android NDK r28b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          add-to-path: true
          link-to-sdk: true

      - name: Configure NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Build libbox.aar
        run: |
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box-core
          cd /tmp/sing-box-core

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH=$PATH:$(go env GOPATH)/bin

          gomobile init
          go run ./cmd/internal/build_libbox -target android

          mkdir -p "${{ github.workspace }}/app/libs"
          cp libbox.aar "${{ github.workspace }}/app/libs/"

          cd "${{ github.workspace }}"
          ls -lh app/libs/

      - name: Patch updater userAgent
        run: |
          sed -i 's/\buserAgent\b/"SFAxtnd"/g' app/src/github/java/io/nekohasekai/sfa/vendor/ApkDownloader.kt || true
          sed -i 's/\buserAgent\b/"SFAxtnd"/g' app/src/github/java/io/nekohasekai/sfa/vendor/GitHubUpdateChecker.kt || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFAxtnd-Debug-APK
          path: app/build/outputs/apk/**/debug/*.apk
          
