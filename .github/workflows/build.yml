name: Build SFAxtnd

on:
  push:
    branches:
      - dev
      - master
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Auto Bump Version
        run: |
          BASE_VERSION="1.0"
          PATCH_VERSION="${{ github.run_number }}"
          FULL_VERSION="${BASE_VERSION}.${PATCH_VERSION}"

          echo "VERSION_CODE=$PATCH_VERSION" > version.properties
          echo "VERSION_NAME=$FULL_VERSION" >> version.properties

          echo "APP_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "Building SFAxtnd version $FULL_VERSION (Code: $PATCH_VERSION)"

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")
            arch=$(echo "$filename" | grep -o -E '(arm64-v8a|armeabi-v7a|x86_64|x86|universal)' || true)
            if [ -n "$arch" ]; then
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-${arch}.apk"
            else
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-universal.apk"
            fi
          done
          ls -lh dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          body: |
            ### SFAxtnd v${{ env.APP_VERSION }}
            - Сборка на коммите: `${{ github.sha }}`
            - Сплит-туннель: `geosite-category-ru.srs` & `geoip-ru.srs`
            - Версия билда: `${{ env.APP_VERSION }}`
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
