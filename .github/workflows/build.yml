name: Build and Release APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Setup Java 17 (for libbox build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: ${{ runner.os }}-libbox-${{ hashFiles('libbox/**', '**/go.sum', '**/go.mod') }}

      - name: Build libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$(go env GOPATH)/bin:$PATH"
          
          cd libbox
          go run ./cmd/internal/build_libbox
          mkdir -p ../app/libs
          find . -name "*.aar" -exec cp -f {} ../app/libs/libbox.aar \;

      - name: Setup Java 21 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup permanent keystore
        run: |
          mkdir -p ~/.android
          if [ -f ".github/debug.keystore" ]; then
            echo "Using existing permanent keystore"
            cp .github/debug.keystore ~/.android/debug.keystore
          else
            echo "Generating new permanent keystore"
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p .github
            cp ~/.android/debug.keystore .github/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/debug.keystore
            git commit -m "Save permanent debug keystore [skip ci]" || true
            git push origin dev || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/other/debug -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed -E "s/SFA-[0-9\.]+-/SFAxtnd-${APP_VERSION}-/g" | sed "s/-debug//g" | sed "s/app-other/SFAxtnd-${APP_VERSION}/g")
            cp "$file" "release_apks/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
