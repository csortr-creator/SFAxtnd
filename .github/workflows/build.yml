name: Build SFAxtnd

on:
  push:
    branches:
      - dev
      - master
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Set up Android SDK and NDK
        run: |
          echo "y" | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Verify build environment
        run: |
          java --version
          go version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install SagerNet gomobile
        working-directory: libbox
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13

          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

          gomobile version || true
          gobind -version || true

      - name: Build libbox
        working-directory: libbox
        run: |
          go run ./cmd/internal/build_libbox -target android

          ls -lh libbox.aar
          ls -lh libbox-legacy.aar

          cp libbox.aar ../app/libs/libbox.aar
          cp libbox-legacy.aar ../app/libs/libbox-legacy.aar

      - name: Verify generated libraries
        run: |
          ls -lh app/libs/
          test -f app/libs/libbox.aar
          test -f app/libs/libbox-legacy.aar

      - name: Auto Bump Version
        run: |
          BASE_VERSION="1.0"
          PATCH_VERSION="${{ github.run_number }}"
          FULL_VERSION="${BASE_VERSION}.${PATCH_VERSION}"

          {
            echo "VERSION_CODE=$PATCH_VERSION"
            echo "VERSION_NAME=$FULL_VERSION"
          } > version.properties

          echo "APP_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"

          echo "Building SFAxtnd version $FULL_VERSION"
          cat version.properties

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android

          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build APK
        run: |
          chmod +x gradlew

          ./gradlew clean assembleOtherDebug \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" \
            --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist

          find app/build/outputs/apk -type f -name "*.apk" | while read -r file; do

            filename=$(basename "$file")

            arch=$(echo "$filename" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64|x86|universal)' || true)

            if [ -n "$arch" ]; then
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-${arch}.apk"
            else
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-universal.apk"
            fi

          done

          echo "Generated APKs:"
          ls -lh dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          body: |
            ### SFAxtnd v${{ env.APP_VERSION }}

            - Commit: `${{ github.sha }}`
            - Core: sing-box libbox
            - Version: `${{ env.APP_VERSION }}`
            - Run: `${{ github.run_number }}`
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
