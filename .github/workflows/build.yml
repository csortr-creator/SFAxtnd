name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

env:
  APP_VERSION: "0.0.8"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Android NDK r28b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          add-to-path: true
          link-to-sdk: true

      - name: Configure NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build libbox.aar
        run: |
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box-core
          cd /tmp/sing-box-core

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH=$PATH:$(go env GOPATH)/bin

          gomobile init
          go run ./cmd/internal/build_libbox -target android

          mkdir -p "${{ github.workspace }}/app/libs"
          cp libbox.aar "${{ github.workspace }}/app/libs/"

          cd "${{ github.workspace }}"

      - name: Patch project and customize package
        run: |
          find app/src -type f -name "*.kt" -exec sed -i 's/HTTPClient\.userAgent/"SFAxtnd"/g' {} +
          sed -i -E 's/namespace\s*=\s*".*"/namespace = "io.nekohasekai.sfa"/' app/build.gradle.kts || true
          sed -i -E 's/applicationId\s*=\s*"io\.nekohasekai\.sfa"/applicationId = "io.nekohasekai.sfaxtnd"/' app/build.gradle.kts || true
          find app/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">SFAxtnd<\/string>/g' {} +
          sed -i -E 's/versionName\s*=\s*".*"/versionName = "'"$APP_VERSION"'"/' app/build.gradle.kts || true
          sed -i -E 's/versionCode\s*=\s*[0-9]+/versionCode = ${{ github.run_number }}/' app/build.gradle.kts || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p release-apks
          for file in $(find app/build/outputs/apk -type f -name "*.apk"); do
            base_name=$(basename "$file")
            # Заменяем старую версию sing-box на SFAxtnd-0.0.7
            clean_name=$(echo "$base_name" | sed -E "s/SFA-[0-9]+\.[0-9]+\.[0-9]+/SFAxtnd-${APP_VERSION}/" | sed 's/-debug//')
            cp "$file" "release-apks/$clean_name"
          done
          ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          body: "Релиз SFAxtnd версии ${{ env.APP_VERSION }}."
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
