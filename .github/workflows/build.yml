name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Android-клиента
      - name: Checkout SFAxtnd repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Checkout ядра sing-box (СТАБИЛЬНЫЙ тег, не main!)
      # ВАЖНО: замените ref на версию, совместимую с вашим Android-клиентом.
      # Обычно это тег, соответствующий версии в build.gradle/gradle.properties.
      # Для sing-box-for-android 1.11.x используйте v1.11.3
      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.11.3
          path: sing-box-core
          fetch-depth: 1

      # 3. Java 17 — build_libbox строго требует OpenJDK 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Go — для sing-box 1.11.x нужен Go 1.23
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # 5. Кеш Go-модулей — ускоряет повторные сборки в 3–4 раза
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('sing-box-core/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 6. Android NDK r26c — r27c ломает линковку libcronet.a
      - name: Setup Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true
          local-cache: true

      # 7. Сборка libbox.aar
      # Критические исправления:
      #   • gomobile init — ОБЯЗАТЕЛЕН. Без него build_libbox падает сразу.
      #   • ANDROID_NDK + ANDROID_NDK_HOME — обе переменные нужны разным инструментам.
      #   • -androidapi 21 — NDK r26c не поддерживает API 16 (дефолт gomobile).
      #   • -target android/arm64,android/arm — исключаем x86, где чаще ошибки линковки.
      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd sing-box-core
          
          # Устанавливаем форк gomobile от sagernet
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Инициализация gomobile — БЕЗ ЭТОГО НИЧЕГО НЕ ЗАРАБОТАЕТ
          gomobile init -ndk ${{ steps.setup-ndk.outputs.ndk-path }}
          
          # Сборка AAR
          go run ./cmd/internal/build_libbox \
            -target android/arm64,android/arm \
            -androidapi 21
          
          # Копируем результат в проект (ищем в нескольких возможных местах)
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/ 2>/dev/null || \
            cp build/libbox.aar ../app/libs/ 2>/dev/null || \
            find . -name "libbox.aar" -exec cp {} ../app/libs/ \;
          
          cd ..
          echo "=== Содержимое app/libs ==="
          ls -lh app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFAxtnd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
