name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          git clone --depth=1 https://github.com/SagerNet/sing-box.git ../sing-box-core
          
          # Откатываем cronet-go до стабильного коммита без сбойных релокаций Clang
          git clone https://github.com/sagernet/cronet-go.git /tmp/cronet-go
          cd /tmp/cronet-go
          CRONET_COMMIT=$(git log --before="2026-08-25" -n 1 --format="%H")
          if [ -n "$CRONET_COMMIT" ]; then
            git checkout "$CRONET_COMMIT"
          else
            git checkout HEAD~1
          fi
          
          cd ../sing-box-core
          go mod edit -replace=github.com/sagernet/cronet-go=/tmp/cronet-go
          go mod tidy
          
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go run ./cmd/internal/build_libbox -target android
          
          mkdir -p ../SFAxtnd/app/libs
          cp libbox.aar ../SFAxtnd/app/libs/
          cd ../SFAxtnd
          ls -la app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFAxtnd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
