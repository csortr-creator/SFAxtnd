      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/other/debug -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed "s/app-other-debug/SFAxtnd-${APP_VERSION}/g; s/app-other-/SFAxtnd-${APP_VERSION}-/g")
            cp "$file" "release_apks/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: SFAxtnd v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
