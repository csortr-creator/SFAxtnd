name: Build and Release APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          git clone --depth=1 https://github.com/SagerNet/sing-box.git ../sing-box-core
          cd ../sing-box-core

          GOMOBILE_VER=$(grep 'github.com/sagernet/gomobile' go.mod | awk '{print $2}')
          if [ -z "$GOMOBILE_VER" ]; then
            echo "WARNING: gomobile version not found in go.mod, falling back to latest tagged release"
            GOMOBILE_VER=$(git ls-remote --tags https://github.com/sagernet/gomobile.git | awk -F/ '{print $NF}' | sort -V | tail -n1)
          fi
          echo "Using gomobile version: $GOMOBILE_VER"

          go install github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VER}
          go install github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VER}
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

          echo "ANDROID_NDK_HOME is: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT is: $ANDROID_NDK_ROOT"
          
          go run ./cmd/internal/build_libbox -target android

          cd -
          mkdir -p app/libs
          find ../sing-box-core -name "libbox.aar" -exec cp {} app/libs/ \;
          ls -la app/libs/
          test -f app/libs/libbox.aar || (echo "ERROR: libbox.aar was not built!" && exit 1)

